name: Dependency validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --include=dev
      - uses: ./.github/actions/build-web
      - uses: ./.github/actions/capture-preview
      - run: node web/validate-pages.mjs
      - name: Upload preview diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: validation-preview-diagnostics
          path: .cache/preview/
          if-no-files-found: ignore
          retention-days: 7
