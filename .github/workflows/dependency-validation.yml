name: Dependency validation
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --include=dev
      - run: npm test
      - uses: ./.github/actions/build-web
      - name: Verify game floppy with independent FAT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mtools dosfstools
          fsck.fat -n dist/game.img
          mdir -i dist/game.img ::/Language
          mtype -i dist/game.img ::/kryz.bat | tr -d '\r' > /tmp/kryz-from-floppy.bat
          tr -d '\r' < kryz.bat | cmp - /tmp/kryz-from-floppy.bat
