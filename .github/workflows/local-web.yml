name: Build local browser demo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # act binds both jobs to the same checkout; avoid concurrent file writes.
      max-parallel: 1
      matrix:
        language: [en, lt]
    steps:
      - uses: actions/checkout@v7
        if: ${{ !env.ACT }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: npm ci --include=dev
      - uses: ./.github/actions/build-web
        with:
          language: ${{ matrix.language }}
      - uses: ./.github/actions/capture-preview
        with:
          language: ${{ matrix.language }}
      - env:
          BUILD_LANGUAGE: ${{ matrix.language }}
        run: node web/validate-pages.mjs "$BUILD_LANGUAGE"
