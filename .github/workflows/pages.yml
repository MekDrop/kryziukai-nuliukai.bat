name: Publish v86 demo
on:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Install all npm dependencies
        run: npm ci --include=dev
      - name: Build website
        run: npm run build
      - name: Verify game floppy with independent FAT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mtools dosfstools
          fsck.fat -n dist/game.img
          mdir -i dist/game.img ::/Language
          mtype -i dist/game.img ::/kryz.bat | tr -d '\r' > /tmp/kryz-from-floppy.bat
          tr -d '\r' < kryz.bat | cmp - /tmp/kryz-from-floppy.bat
      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
